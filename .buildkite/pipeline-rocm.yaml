# Buildkite CI for vime — AMD ROCm GPU suites on the self-hosted gfx950 (MI355X) queue (amd_mi355_vime_rl),
# running the prebuilt ROCm image. Steps set NOSET_*/NCCL_* ROCm env; fully_async gates, gsm8k soft_fails (NaN-logprob).

env:
  # Prebuilt ROCm image (built from docker/Dockerfile.rocm). Override per-agent
  # via a pipeline/agent env var if the image is published elsewhere.
  VIME_ROCM_IMAGE: "vllm/vime-rocm:latest"

steps:
  # Manual gate — the GPU suites are expensive, so they run on demand rather
  # than on every commit (matches the CUDA pipeline.yml gate).
  - block: ":amd: Run AMD ROCm GPU suites?"
    key: rocm-gate
    blocked_state: passed

  - group: ":amd: ROCm GPU Tests"
    depends_on: rocm-gate
    steps:
      - label: ":fire: short · fully_async 0.5B (4 GPU)"
        key: rocm-fully-async-short
        agents:
          queue: amd_mi355_vime_rl
        timeout_in_minutes: 360
        soft_fail: false
        retry:
          automatic:
            - exit_status: -1  # agent lost (fresh instance failed to boot)
              limit: 2
        env:
          TEST_FILE: "test_qwen2.5_0.5B_fully_async_short.py"
          NUM_GPUS: "4"
        # $$VAR escaped so buildkite-agent expands at run time (not emptied at pipeline-upload);
        # inner `bash -lc` is single-quoted so $TEST_FILE/$NUM_GPUS come from the forwarded -e env.
        command: &rocm_gpu_test |
          docker run --rm \
            --device=/dev/kfd --device=/dev/dri --group-add video --privileged \
            --security-opt seccomp=unconfined --ipc=host --shm-size=16g \
            --ulimit memlock=-1 --ulimit stack=67108864 --ulimit nofile=1048576:1048576 \
            -e VIME_AMD_ROCM=1 -e VIME_TEST_DEVICE=rocm -e VIME_SCRIPT_EXTERNAL_RAY=0 \
            -e RAY_EXPERIMENTAL_NOSET_HIP_VISIBLE_DEVICES=1 \
            -e RAY_EXPERIMENTAL_NOSET_CUDA_VISIBLE_DEVICES=1 \
            -e RAY_EXPERIMENTAL_NOSET_ROCR_VISIBLE_DEVICES=1 \
            -e NCCL_CUMEM_ENABLE=0 -e NCCL_P2P_DISABLE=1 -e NCCL_IB_DISABLE=1 \
            -e HF_HOME=/root/.cache/huggingface \
            -e GITHUB_COMMIT_NAME="$$BUILDKITE_COMMIT" \
            -e TEST_FILE -e NUM_GPUS \
            -v "/root/.cache/huggingface:/root/.cache/huggingface" \
            -v "$$PWD:/root/vime" -w /root/vime \
            --entrypoint bash "$$VIME_ROCM_IMAGE" -lc '
              set -euo pipefail
              pip install -e . --no-deps --break-system-packages
              # ROCm: align CUDA_VISIBLE_DEVICES with the locked HIP set inside the
              # launched command so the device resolver maps non-contiguous GPUs.
              python tests/ci/gpu_lock_exec.py \
                --count "$$NUM_GPUS" --target-env-name HIP_VISIBLE_DEVICES \
                -- bash -c '\''export CUDA_VISIBLE_DEVICES="$$HIP_VISIBLE_DEVICES"; exec python "tests/$$TEST_FILE"'\''
            '

      # gsm8k not green: vLLM returns NaN rollout logprobs for Qwen3.5-0.8B on ROCm, diverging
      # the train-vs-rollout check. soft_fail (non-blocking) until it passes on the U.is_rocm() path.
      - label: ":warning: short · gsm8k 0.8B (4 GPU) [soft-fail]"
        key: rocm-gsm8k-short
        agents:
          queue: amd_mi355_vime_rl
        timeout_in_minutes: 360
        soft_fail: true
        retry:
          automatic:
            - exit_status: -1
              limit: 2
        env:
          TEST_FILE: "test_qwen3.5_0.8B_gsm8k_short.py"
          NUM_GPUS: "4"
        command: *rocm_gpu_test

      - label: ":warning: short · gsm8k_async 0.8B (4 GPU) [soft-fail]"
        key: rocm-gsm8k-async-short
        agents:
          queue: amd_mi355_vime_rl
        timeout_in_minutes: 360
        soft_fail: true
        retry:
          automatic:
            - exit_status: -1
              limit: 2
        env:
          TEST_FILE: "test_qwen3.5_0.8B_gsm8k_async_short.py"
          NUM_GPUS: "4"
        command: *rocm_gpu_test

      # vllm-config suites — green on ROCm via the -rocm.py variants (--no-gradient-accumulation-fusion,
      # vLLM mem-util 0.3, --update-weight-transport disk for the colocate cases).
      - label: ":fire: vllm-config · distributed 0.5B (8 GPU)"
        key: rocm-vllm-config-distributed
        agents:
          queue: amd_mi355_vime_rl
        timeout_in_minutes: 360
        soft_fail: false
        retry:
          automatic:
            - exit_status: -1
              limit: 2
        env:
          TEST_FILE: "test_qwen2.5_0.5B_vllm_config_distributed-rocm.py"
          NUM_GPUS: "8"
        command: *rocm_gpu_test

      - label: ":fire: vllm-config · single 0.5B (8 GPU)"
        key: rocm-vllm-config
        agents:
          queue: amd_mi355_vime_rl
        timeout_in_minutes: 360
        soft_fail: false
        retry:
          automatic:
            - exit_status: -1
              limit: 2
        env:
          TEST_FILE: "test_qwen2.5_0.5B_vllm_config-rocm.py"
          NUM_GPUS: "8"
        command: *rocm_gpu_test

      - label: ":fire: vllm-config · mixed_offload 0.5B (8 GPU)"
        key: rocm-vllm-config-mixed-offload
        agents:
          queue: amd_mi355_vime_rl
        timeout_in_minutes: 360
        soft_fail: false
        retry:
          automatic:
            - exit_status: -1
              limit: 2
        env:
          TEST_FILE: "test_vllm_config_mixed_offload-rocm.py"
          NUM_GPUS: "8"
        command: *rocm_gpu_test

      - label: ":fire: vllm-config · mixed_offload_ft 0.5B (8 GPU)"
        key: rocm-vllm-config-mixed-offload-ft
        agents:
          queue: amd_mi355_vime_rl
        timeout_in_minutes: 360
        soft_fail: false
        retry:
          automatic:
            - exit_status: -1
              limit: 2
        env:
          TEST_FILE: "test_vllm_config_mixed_offload_ft-rocm.py"
          NUM_GPUS: "8"
        command: *rocm_gpu_test
