# buildkite-agent pipeline upload .buildkite/pipeline-npu.yaml

# This pipeline is for running NPU tests on PRs . 
steps:
  - group: ":pipeline: Run NPU test"
    key: npu-tests
    steps:
      - label: "qwen3-4B-npu test"
        key: qwen3-4B-npu
        agents:
          queue: "ascend-a3"
          resource_class: "npu-8"
        images:  "quay.io/ascend/vime:vime-latest"
        timeout_in_minutes: 60
        plugins:
          - kubernetes:
              working_dir: /root 
              podSpecPatch:
                imagePullSecrets:
                  - name: swr-secret
        env:
          export WORKSPACE: /root
          HF_HOME: /root/.cache/huggingface
          VIME_TEST_ENABLE_INFINITE_RUN: false
          BUILDKITE_PULL_REQUEST: "${BUILDKITE_PULL_REQUEST:-false}"
          BUILDKITE_COMMIT: "${BUILDKITE_COMMIT}"
          GITHUB_COMMIT_NAME: "${BUILDKITE_COMMIT}_${BUILDKITE_PULL_REQUEST:-non-pr}"
          HF_TOKEN: "${HF_TOKEN}"
        command: |
          set -euo pipefail
          cd /root/vime
          if [ -n \"${BUILDKITE_COMMIT}\" ]; then
            git fetch origin ${BUILDKITE_COMMIT}
            git checkout ${BUILDKITE_COMMIT}
            pip install -e . --no-deps --break-system-packages || pip install -e . --no-deps
          fi
          hf download Qwen/Qwen3-4B
          hf download --repo-type dataset zhuzilin/dapo-math-17k
          bash scripts/run-qwen3-4B-npu.sh

